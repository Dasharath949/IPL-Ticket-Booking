
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>IPL 2026 Ticket Booking</h1>

    <form action="#" method="get">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name"
               minlength="3" maxlength="30" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
               pattern="[0-9]{10}" minlength="10"
               maxlength="10" required>

        <br><br>

        <label for="match">Select Match:</label>
        <select id="match" name="match" required>
            <option value="">Choose Match</option>
            <option value="CSK vs MI">CSK vs MI</option>
            <option value="RCB vs KKR">RCB vs KKR</option>
            <option value="MI vs RCB">MI vs RCB</option>
        </select>

        <br><br>

        <label for="stand">Stand Category:</label>
        <select id="stand" name="stand" required>
            <option value="">Choose Stand</option>
            <option value="General">General</option>
            <option value="Premium">Premium</option>
            <option value="VIP">VIP</option>
        </select>

        <br><br>

        <label for="quantity">Number of Tickets:</label>
        <input type="number" id="quantity" name="quantity"
               min="1" max="10" required>

        <br><br>

        <p>Additional Preference:</p>

        <input type="radio" id="aisle" name="preference" value="Aisle">
        <label for="aisle">Aisle Seat</label>

        <input type="radio" id="center" name="preference" value="Center">
        <label for="center">Center Seat</label>

        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>

</body>
</html>
